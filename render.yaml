databases:
  - name: secure-exam-db
    databaseName: secure_exam
    user: secure_exam_user
    plan: free
    region: oregon

services:
  - type: web
    name: secure-exam-system
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: secure-exam-db
          property: connectionString
