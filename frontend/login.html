<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Exam System - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container auth-wrapper">
        <div class="glass-panel auth-card">
            <div class="logo-header">
                <div class="logo-icon">🛡️ SECURE EXAM</div>
                <p style="color: var(--text-secondary);">Multi-Layer Secure Examination Environment</p>
            </div>
            
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="email" id="email-label">Institutional Email</label>
                    <input class="form-control" type="email" id="email" placeholder="admin@university.edu" required>
                </div>
                
                <div class="form-group" id="student-details-group" style="display: none; margin-bottom: 1rem;">
                    <div style="margin-bottom: 1rem;">
                        <label class="form-label" for="username">Candidate Name</label>
                        <input class="form-control" type="text" id="username" placeholder="John Doe">
                    </div>
                    <div>
                        <label class="form-label" for="student-id">User ID (Roll/Emp No)</label>
                        <input class="form-control" type="text" id="student-id" placeholder="CS2026101">
                    </div>
                </div>

                <div class="form-group" id="password-group" style="display: block;">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" type="password" id="password" placeholder="••••••••" required>
                </div>
                
                <button class="btn btn-primary" id="btn-submit" style="width: 100%; margin-top: 1rem;" type="submit">Sign In as Admin</button>
            </form>
            
            <p id="register-link-container" style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary); display: block;">
                Don't have an admin account? <a href="register.html" style="color: var(--accent-primary); text-decoration: none; font-weight: 500;">Register Here</a>
            </p>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Redirect if already authenticated (Admin only; Students must always see the login gate to prevent session leakage)
        const adminToken = localStorage.getItem("admin_token");
        const urlParams = new URLSearchParams(window.location.search);
        const redirectUrl = urlParams.get("redirect");
        
        if (redirectUrl) {
            const isTargetAdmin = decodeURIComponent(redirectUrl).includes("/admin/");
            if (isTargetAdmin && adminToken) {
                window.location.href = decodeURIComponent(redirectUrl);
            }
        } else {
            if (adminToken) {
                window.location.href = "admin/dashboard.html";
            }
        }

        let activeRole = "admin";
        
        const passwordGroup = document.getElementById("password-group");
        const passwordInput = document.getElementById("password");
        const emailLabel = document.getElementById("email-label");
        const btnSubmit = document.getElementById("btn-submit");
        const registerContainer = document.getElementById("register-link-container");

        const studentDetailsGroup = document.getElementById("student-details-group");
        const usernameInput = document.getElementById("username");
        const studentIdInput = document.getElementById("student-id");

        function initializeView() {
            if (redirectUrl) {
                const isTargetAdmin = decodeURIComponent(redirectUrl).includes("/admin/");
                if (isTargetAdmin) {
                    activeRole = "admin";
                    passwordGroup.style.display = "block";
                    passwordInput.required = true;
                    studentDetailsGroup.style.display = "none";
                    usernameInput.required = false;
                    studentIdInput.required = false;
                    emailLabel.innerText = "Institutional Email";
                    btnSubmit.innerText = "Sign In as Admin";
                    registerContainer.style.display = "block";
                } else {
                    activeRole = "student";
                    passwordGroup.style.display = "none";
                    passwordInput.required = false;
                    studentDetailsGroup.style.display = "block";
                    usernameInput.required = true;
                    studentIdInput.required = true;
                    emailLabel.innerText = "Candidate Email";
                    btnSubmit.innerText = "Enter Examination";
                    registerContainer.style.display = "none";
                    
                    // Prevent session mixups: clear old student credentials on login screen mount
                    localStorage.removeItem("token");
                    localStorage.removeItem("user");
                    localStorage.removeItem("attempt_id");
                    localStorage.removeItem("session_token");
                    localStorage.removeItem("selected_exam_id");
                }
            } else {
                // Default direct access shows only the Admin login page
                activeRole = "admin";
                passwordGroup.style.display = "block";
                passwordInput.required = true;
                studentDetailsGroup.style.display = "none";
                usernameInput.required = false;
                studentIdInput.required = false;
                emailLabel.innerText = "Institutional Email";
                btnSubmit.innerText = "Sign In as Admin";
                registerContainer.style.display = "block";
            }
        }

        document.getElementById("login-form").addEventListener("submit", function(e) {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = activeRole === "admin" ? passwordInput.value : "";
            const username = activeRole === "student" ? usernameInput.value : "";
            const studentId = activeRole === "student" ? studentIdInput.value : "";
            handleLogin(email, password, username, studentId);
        });

        // Initialize the login screen view state based on redirect URL
        initializeView();
    </script>
</body>
</html>
