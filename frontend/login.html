<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Exam System - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container auth-wrapper">
        <div class="glass-panel auth-card">
            <h2 style="font-family: var(--font-heading); text-align: center; margin-bottom: 2.5rem;" id="login-title">Administrator Login</h2>
            
            <!-- Unified Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="email" id="email-label">Institutional Email</label>
                    <input class="form-control" type="text" id="email" placeholder="admin@gmail.com" required>
                </div>
                
                <div class="form-group" id="password-group">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" type="password" id="password" placeholder="••••••••" required>
                </div>
                
                <button class="btn btn-primary" id="btn-submit" style="width: 100%; margin-top: 1.5rem;" type="submit">Sign In as Admin</button>
            </form>

            <!-- Toggle Register Link -->
            <p id="toggle-registration-link" style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary); text-align: center; display: none;">
                New candidate? <a href="#" onclick="toggleRegisterForm(true); return false;" style="color: var(--accent-primary); text-decoration: none; font-weight: 500;">Register Here</a>
            </p>

            <!-- Toggled Student Registration Form -->
            <form id="register-form" style="display: none;">
                <h2 style="font-family: var(--font-heading); text-align: center; margin-bottom: 1.5rem;">Candidate Registration</h2>
                <div class="form-group">
                    <label class="form-label" for="reg-name">Candidate Name</label>
                    <input class="form-control" type="text" id="reg-name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="reg-email">Gmail ID</label>
                    <input class="form-control" type="email" id="reg-email" placeholder="student@gmail.com" required>
                </div>
                <button class="btn btn-primary" style="width: 100%; margin-top: 1.25rem;" type="submit">Submit Registration</button>
                <p style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary); text-align: center;">
                    Already registered? <a href="#" onclick="toggleRegisterForm(false); return false;" style="color: var(--accent-primary); text-decoration: none; font-weight: 500;">Sign In</a>
                </p>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Redirect if already authenticated (Admin only; Students must always see the login gate to prevent session leakage)
        const adminToken = localStorage.getItem("admin_token");
        const urlParams = new URLSearchParams(window.location.search);
        const redirectUrl = urlParams.get("redirect");
        
        if (redirectUrl) {
            const isTargetAdmin = decodeURIComponent(redirectUrl).includes("/admin/");
            if (isTargetAdmin && adminToken) {
                window.location.href = decodeURIComponent(redirectUrl);
            }
        } else {
            const roleParam = urlParams.get("role");
            if (adminToken && roleParam !== "student") {
                window.location.href = "admin/dashboard.html";
            }
        }

        let activeRole = "admin";
        
        const passwordGroup = document.getElementById("password-group");
        const passwordInput = document.getElementById("password");
        const emailLabel = document.getElementById("email-label");
        const emailInput = document.getElementById("email");
        const btnSubmit = document.getElementById("btn-submit");
        const toggleRegLink = document.getElementById("toggle-registration-link");

        function toggleRegisterForm(show) {
            const loginForm = document.getElementById("login-form");
            const regForm = document.getElementById("register-form");
            if (show) {
                loginForm.style.display = "none";
                regForm.style.display = "block";
                toggleRegLink.style.display = "none";
            } else {
                loginForm.style.display = "block";
                regForm.style.display = "none";
                toggleRegLink.style.display = "block";
            }
        }

        function initializeView() {
            const roleParam = urlParams.get("role");
            if (roleParam === "student") {
                activeRole = "student";
                passwordGroup.style.display = "none";
                passwordInput.required = false;
                emailLabel.innerText = "Gmail ID";
                emailInput.placeholder = "Enter your Gmail ID";
                btnSubmit.innerText = "Enter Examination";
                toggleRegLink.style.display = "block";
                
                localStorage.removeItem("token");
                localStorage.removeItem("user");
                localStorage.removeItem("attempt_id");
                localStorage.removeItem("session_token");
                localStorage.removeItem("selected_exam_id");
            } else if (redirectUrl) {
                const isTargetAdmin = decodeURIComponent(redirectUrl).includes("/admin/");
                if (isTargetAdmin) {
                    activeRole = "admin";
                    passwordGroup.style.display = "block";
                    passwordInput.required = true;
                    emailLabel.innerText = "Institutional Email";
                    emailInput.placeholder = "admin@gmail.com";
                    btnSubmit.innerText = "Sign In as Admin";
                    toggleRegLink.style.display = "none";
                } else {
                    activeRole = "student";
                    passwordGroup.style.display = "none";
                    passwordInput.required = false;
                    emailLabel.innerText = "Gmail ID";
                    emailInput.placeholder = "Enter your Gmail ID";
                    btnSubmit.innerText = "Enter Examination";
                    toggleRegLink.style.display = "block";
                    
                    localStorage.removeItem("token");
                    localStorage.removeItem("user");
                    localStorage.removeItem("attempt_id");
                    localStorage.removeItem("session_token");
                    localStorage.removeItem("selected_exam_id");
                }
            } else {
                // Default direct access shows only the Admin login page
                activeRole = "admin";
                passwordGroup.style.display = "block";
                passwordInput.required = true;
                emailLabel.innerText = "Institutional Email";
                emailInput.placeholder = "admin@gmail.com";
                btnSubmit.innerText = "Sign In as Admin";
                toggleRegLink.style.display = "none";
            }
        }

        document.getElementById("login-form").addEventListener("submit", function(e) {
            e.preventDefault();
            const email = emailInput.value;
            const password = activeRole === "admin" ? passwordInput.value : "";
            handleLogin(email, password);
        });

        document.getElementById("register-form").addEventListener("submit", async function(e) {
            e.preventDefault();
            const name = document.getElementById("reg-name").value;
            const email = document.getElementById("reg-email").value;
            
            const res = await API.post("/auth/register-student", {
                first_name: name,
                email: email
            });
            
            if (res.success) {
                alert(res.message);
                toggleRegisterForm(false);
            } else {
                alert(res.message || "Registration submission failed.");
            }
        });

        // Initialize the login screen view state based on redirect URL
        initializeView();
    </script>
</body>
</html>
