<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Exam System - Proctoring Violations</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="#" class="nav-brand">🛡️ SECURE EXAM (ADMIN)</a>
        <div class="nav-links">
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="exams.html" class="nav-link">Manage Exams</a>
            <a href="violations.html" class="nav-link active">Violations</a>
            <a href="results.html" class="nav-link">Student Results</a>
            <span id="user-display" style="color: var(--text-secondary); font-size: 0.95rem; font-weight: 500;"></span>
            <a href="#" class="nav-link" onclick="handleLogout()">Sign Out</a>
        </div>
    </nav>

    <div class="container">
        <h2 style="font-family: var(--font-heading); margin-bottom: 2rem;">Proctoring Evidence Review</h2>

        <div class="glass-panel">
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Student</th>
                            <th>Exam Name</th>
                            <th>Infrac Type</th>
                            <th>Conf</th>
                            <th>Timestamp</th>
                            <th>Severity</th>
                            <th>Webcam Snapshot</th>
                        </tr>
                    </thead>
                    <tbody id="violations-body">
                        <tr>
                            <td colspan="7" style="color: var(--text-secondary);">Loading violations records...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- EVIDENCE MODAL PREVIEW -->
    <div class="modal-backdrop" id="evidence-modal">
        <div class="glass-panel modal-content" style="max-width: 500px; text-align: center;">
            <h3 style="margin-bottom: 1rem;">Evidence Screenshot</h3>
            <div class="video-feed-wrapper" style="width: 100%; height: 320px; border-color: var(--accent-primary);">
                <img id="evidence-img" src="" alt="Evidence Frame" style="width: 100%; height: 100%; object-fit: contain; background: #000;">
            </div>
            <div style="margin-top: 1.5rem; display: flex; justify-content: flex-end;">
                <button class="btn btn-secondary" onclick="closeEvidenceModal()">Close Review</button>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        checkAuth("admin");
        document.getElementById("user-display").innerText = `Admin: ${currentUser.first_name}`;

        async function loadViolations() {
            const res = await API.get("/admin/violations");
            const body = document.getElementById("violations-body");
            if (res.success) {
                if (res.violations.length > 0) {
                    body.innerHTML = res.violations.map(v => `
                        <tr>
                            <td>
                                <strong>${v.student_name}</strong> <br>
                                <span style="font-size: 0.8rem; color: var(--text-muted);">${v.student_email}</span>
                            </td>
                            <td>${v.exam_title}</td>
                            <td><strong style="color: var(--accent-danger);">${v.event_type.replace('_', ' ')}</strong></td>
                            <td>${(v.confidence * 100).toFixed(0)}%</td>
                            <td>${new Date(v.timestamp).toLocaleString()}</td>
                            <td><span class="badge badge-${v.action_taken === 'TERMINATE' ? 'danger' : 'warning'}">${v.action_taken}</span></td>
                            <td>
                                ${v.evidence_path ? 
                                    `<button class="btn btn-primary" onclick="viewEvidence('${v.evidence_path}')" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">View Frame</button>` : 
                                    '<span style="color: var(--text-muted);">No Snapshot</span>'
                                }
                            </td>
                        </tr>
                    `).join('');
                } else {
                    body.innerHTML = `<tr><td colspan="7" style="color: var(--text-secondary); text-align: center;">No proctoring violation logs in database.</td></tr>`;
                }
            } else {
                alert("Failed to load violation records.");
            }
        }

        function viewEvidence(path) {
            const token = currentToken;
            // Add authorization token parameter to serve the image safely to admin
            const imgUrl = `http://127.0.0.1:5001${path}?token=${token}`;
            
            // Wait, our backend served evidence requires a Bearer header.
            // But we can update backend /api/admin/evidence/<id> endpoint to also accept token as query param
            // OR fetch the image via JS fetch with Authorization header, generate ObjectURL and show it.
            // Let's use Javascript fetch to make it highly secure and avoid exposing token in URL!
            
            fetch(imgUrl, {
                headers: {
                    "Authorization": `Bearer ${token}`
                }
            })
            .then(res => res.blob())
            .then(blob => {
                const objectURL = URL.createObjectURL(blob);
                document.getElementById("evidence-img").src = objectURL;
                document.getElementById("evidence-modal").classList.add("active");
            })
            .catch(err => {
                console.error("Failed to load evidence frame:", err);
                alert("Could not load evidence screenshot.");
            });
        }

        function closeEvidenceModal() {
            document.getElementById("evidence-modal").classList.remove("active");
            document.getElementById("evidence-img").src = "";
        }

        loadViolations();
    </script>
</body>
</html>
