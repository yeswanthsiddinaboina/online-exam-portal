<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Exam System - Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container auth-wrapper">
        <div class="glass-panel auth-card">
            <div class="logo-header">
                <div class="logo-icon">🛡️ SECURE EXAM</div>
                <p style="color: var(--text-secondary);">Create Account</p>
            </div>
            
            <form id="register-form">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label" for="first-name">First Name</label>
                        <input class="form-control" type="text" id="first-name" placeholder="John" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="last-name">Last Name</label>
                        <input class="form-control" type="text" id="last-name" placeholder="Doe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Institutional Email</label>
                    <input class="form-control" type="email" id="email" placeholder="john.doe@university.edu" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="role">User Role</label>
                    <select class="form-control" id="role" style="background: rgba(15, 17, 28, 0.8);">
                        <option value="student">Candidate / Student</option>
                        <option value="admin">Admin / Examiner</option>
                    </select>
                </div>
                
                <button class="btn btn-primary" style="width: 100%; margin-top: 1rem;" type="submit">Sign Up</button>
            </form>
            
            <p style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
                Already have an account? <a href="login.html" style="color: var(--accent-primary); text-decoration: none; font-weight: 500;">Sign In</a>
            </p>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById("register-form").addEventListener("submit", function(e) {
            e.preventDefault();
            const firstName = document.getElementById("first-name").value;
            const lastName = document.getElementById("last-name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const role = document.getElementById("role").value;
            handleRegister(firstName, lastName, email, password, role);
        });
    </script>
</body>
</html>
